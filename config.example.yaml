# Stateful replay benchmark configuration.
#
# Copy to config.yaml and edit for your AWS VM. All paths must be absolute on
# the VM where run.py is executed.

besu:
  # Image must support engine_newPayloadV5 (Amsterdam fork) and the
  # blockAccessList / slotNumber payload fields produced by the input data.
  image: hyperledger/besu:latest
  container_name: besu-bench

  # Snapshot directory. Treated as the read-only lowerdir of the overlay; the
  # snapshot itself is never written to.
  data_snapshot_dir: /data/besu

  # Two-layer overlay scratch root. The runner / overlay.sh creates:
  #   <overlay_dir>/prelude/{upper,work,merged}   - writes from gas-bump+funding
  #   <overlay_dir>/test/{upper,work,merged}      - writes from current test
  # Besu always mounts <overlay_dir>/test/merged at container_data_path.
  overlay_dir: /data/besu-overlay

  # Where the overlay's test/merged is bind-mounted inside the container.
  # Must match the --data-path you put in extra_args (the runner adds
  # --data-path=<container_data_path> automatically; do NOT also list it
  # in extra_args).
  container_data_path: /opt/besu/data

  # Optional: override the image's ENTRYPOINT. Some images (e.g.
  # ethpandaops/besu) ship a wrapper that does `chown -R besu:besu
  # /opt/besu/data` before exec'ing besu. On a multi-GB Bonsai snapshot
  # over OverlayFS that recursive chown can take many minutes with zero
  # log output. Pointing at the real launcher skips it entirely.
  # Leave commented out for stock hyperledger/besu images.
  entrypoint: /opt/besu/bin/besu

  # JWT secret on the HOST. The runner reads this file to sign Engine API
  # requests. Bind-mount it into the container yourself via extra_mounts
  # below (so you can name the in-container path freely).
  jwt_secret_path: /tmp/jwtsecret

  # Engine API endpoint as reachable from the host running run.py.
  # With `--network host` this is 127.0.0.1:8551.
  engine_url: http://127.0.0.1:8551

  # Files / directories bind-mounted into the container, in addition to the
  # overlay test/merged → container_data_path mount the runner always adds.
  # Format: "host_path:container_path[:ro]" (standard `docker -v` syntax).
  extra_mounts:
    - /tmp/jwtsecret:/tmp/jwtsecret:ro
    - /tmp/genesis.json:/tmp/genesis.json:ro

  # Full Besu command line. The runner prepends ONLY --data-path=<container_data_path>;
  # everything else is your call. JWT path / genesis path here must match the
  # in-container paths from extra_mounts above.
  extra_args:
    - --data-storage-format=BONSAI
    - --p2p-enabled=false
    - --sync-mode=FULL
    - --max-peers=0
    - --discovery-enabled=false
    - --rpc-http-enabled=true
    - --rpc-http-host=0.0.0.0
    - --rpc-http-port=8545
    - --rpc-http-api=ETH,NET,DEBUG,MINER,NET,PERM,ADMIN,TXPOOL,WEB3
    - --rpc-http-cors-origins=*
    - --Xhttp-timeout-seconds=660
    - --host-allowlist=*
    - --engine-rpc-enabled=true
    - --engine-jwt-secret=/tmp/jwtsecret
    - --engine-rpc-port=8551
    - --engine-host-allowlist=*
    - --metrics-enabled=true
    - --metrics-host=0.0.0.0
    - --metrics-port=8008
    - --genesis-file=/tmp/genesis.json
    - --Xbal-state-root-timeout=-1
    - --Xbal-processing-timeout=-1
    - --Xbal-optimization-enabled=false
    - --Xbal-perfect-parallelization-enabled=false
    - --Xbal-trust-state-root=false

  # Seconds to wait for the Engine API to become responsive after `docker run`.
  # In `restart` isolation mode this timeout is also used per test, so set it
  # generously enough to cover Besu's cold start.
  startup_timeout_s: 120

input:
  # Directory containing funding.txt, gas-bump.txt, setup/, testing/.
  dir: /home/ahamlat/reproduce-8038

  # Files replayed before any test, IN ORDER. The chain is built bottom-up:
  # snapshot tip -> gas-bump (5000 blocks) -> funding (1 block) -> tests.
  # Reversing this order will fail because funding's parentHash is the
  # gas-bump tip.
  prelude:
    - gas-bump.txt
    - funding.txt

tests:
  setup_subdir: setup
  testing_subdir: testing

  # Glob over basenames in setup_subdir. Matched names must also exist in
  # testing_subdir; pairs that don't match are skipped with a warning.
  # Examples:
  #   "*"                                   -> all tests
  #   "*BALANCE*30M*"                       -> only BALANCE 30M cases
  #   "test_account_query.py__*"            -> all account_query tests
  filter: "*"

  # alphabetical | as_listed | shuffled
  order: alphabetical

run:
  # The runner always uses per-test isolation: at the start of every sweep
  # both overlay layers are wiped and Besu is started; the prelude
  # (gas-bump.txt then funding.txt) is replayed once into the prelude layer;
  # then for EACH selected test, Besu is stopped, ONLY the test layer is
  # wiped (the two-layer overlay preserves the prelude writes), Besu is
  # restarted, and setup/<name>.txt + testing/<name>.txt are replayed.

  # Reset (umount + wipe upper/work + remount) the FULL overlay (both layers)
  # at the start of every sweep. Set false to resume from the previous run's
  # writes (rare; only useful for incremental experiments).
  reset_overlay: true

  # How to reset Besu's on-disk state between tests:
  #   overlayfs (default) - OverlayFS over the read-only snapshot DIRECTORY
  #                         (scripts/overlay.sh). No extra disks; reset is an
  #                         instant directory wipe, but first-write copy-up and
  #                         the stacked filesystem add overhead in the hot path.
  #   schelk              - tempoxyz/schelk: dm-era block-level rollback
  #                         (scripts/schelk.sh). The benchmark runs against a
  #                         plain ext4 on a real NVMe (no overlay, no copy-up),
  #                         so block-execution numbers are not distorted; reset
  #                         copies back only the blocks the test wrote. Requires
  #                         two equal-size block devices + a ramdisk (see the
  #                         `schelk:` section below) and a one-time
  #                         `sudo scripts/schelk.sh init ...`.
  # Override on the CLI with --reset-backend {overlayfs,schelk}.
  reset_backend: overlayfs

  # Per-sweep timestamped subdirectory is created under this path.
  log_dir: ./runs

  # Per-request HTTP timeout (seconds).
  request_timeout_s: 120

  # Stop the sweep on the first non-VALID response.
  fail_fast: false

  # Stop and remove the Besu container when the sweep finishes (or on error).
  # Set false to leave it running for inspection.
  stop_container_on_exit: true

# Async-profiler integration (optional). When enabled (here OR via --profile
# on the CLI), the runner brackets the LAST newPayload + FCU pair of each
# phase with `asprof start` / `asprof stop`. This gives one flame graph per
# phase per test: the heavy setup block and the measured testing block.
#
# Bootstrap once:  scripts/install-async-profiler.sh /home/<user>/async-profiler
profile:
  # CLI --profile sets this to true. Default keeps it off to avoid surprises.
  enabled: false

  # Host directory containing bin/asprof (extracted by install-async-profiler.sh).
  host_dir: /home/ahamlat/async-profiler

  # Where the runner bind-mounts host_dir read-only inside the Besu container.
  # Anywhere safe for that image will do.
  container_dir: /opt/async-profiler

  # asprof event:
  #   wall   - wall-clock; no kernel tuning required, captures CPU + wait/IO time
  #   cpu    - on-CPU only; needs sudo sysctl -w kernel.perf_event_paranoid=1
  #   itimer - poor man's CPU profiler, no perf_events
  #   alloc, lock, ...
  # Default `wall` is the safe choice for quickly seeing where Besu spends
  # its time during a heavy block (including I/O / lock waits).
  event: wall

  # asprof sampling interval (-i). 1ms is a good default for 1-15s blocks.
  interval: 1ms

  # Output format -> file extension. html/flamegraph -> .html, jfr -> .jfr.
  # html is self-contained and viewable in a browser; jfr needs JMC/IntelliJ.
  # NOTE: only jfr can hold MULTIPLE event types at once (see alloc/lock below).
  output_format: html

  # Allocation (memory) and lock-contention profiling, recorded ALONGSIDE the
  # primary `event` above. These map to async-profiler's --alloc / --lock and
  # only work with output_format: jfr (the runner auto-switches to jfr and
  # warns if you set either with html). Leave unset for a single-event profile.
  #   alloc: sample about once per this many allocated bytes (e.g. 512k, 2m)
  #   lock:  record lock/monitor waits held longer than this (e.g. 10ms, 1ms)
  # Combined CPU + memory + lock profile in one JFR per phase:
  #   event: cpu            # or wall (no perf_events needed)
  #   output_format: jfr
  #   alloc: 512k
  #   lock: 10ms
  # Or just pass --jfr-all on the CLI to get all three without editing config.
  # alloc: 512k
  # lock: 10ms

  # Extra flags passed verbatim to `asprof start`. Defaults include `-t` so
  # the flame graph is split per thread (vert.x workers vs. main vs. GC),
  # which is essential for telling parallel tx execution apart from the
  # critical path. Add e.g. `--cstack=fp` for native frames.
  extra_args:
    - -t

  # asprof --log level. WARN silences "io_uring_wait_cqe failed: -4" spam
  # that async-profiler 4.x emits whenever its sample-poll is interrupted
  # by a signal (which happens many times per second on a busy JVM).
  # Bump to INFO/DEBUG when investigating profiler internals.
  log_level: warn

# schelk (dm-era) reset backend. Only used when run.reset_backend == 'schelk'
# (or --reset-backend schelk). Ignored entirely for the default OverlayFS path.
#
# schelk operates on raw BLOCK DEVICES, not directories: a pristine "virgin"
# device holds the baseline Besu snapshot and the "scratch" device is what Besu
# mounts and writes to. dm-era records which 4 KiB blocks the test wrote;
# reset copies only those blocks back from virgin -> scratch.
#
# One-time setup (per VM), then the sweep just calls `schelk restore` per test:
#   1. Put the Besu snapshot on the virgin device (e.g. restore it onto
#      /dev/nvme1n1 and the scratch device /dev/nvme2n1 must be equal size).
#   2. cargo install --path .   # from a clone of github.com/tempoxyz/schelk
#   3. sudo scripts/schelk.sh init \
#          --bin /usr/local/bin/schelk \
#          --virgin /dev/nvme1n1 --scratch /dev/nvme2n1 --ramdisk /dev/ram0 \
#          --mount-point /data/besu-overlay/test/merged --fstype ext4 \
#          --ramdisk-size-kb 4194304
#   4. Add scripts/schelk.sh to the sudoers NOPASSWD allowlist (same as
#      overlay.sh).
# The mount point is ALWAYS <besu.overlay_dir>/test/merged so Besu's existing
# bind mount keeps working; you do not configure it here.
schelk:
  # Path to the schelk binary. Use an ABSOLUTE path: sudo sanitises PATH so a
  # `cargo install` binary in ~/.cargo/bin is not visible to the helper.
  bin: /usr/local/bin/schelk

  # Pristine baseline block device (holds the snapshot; never written by Besu).
  virgin: /dev/nvme1n1

  # Working block device Besu mounts and writes to. Must equal virgin in size.
  scratch: /dev/nvme2n1

  # Block device for dm-era metadata. Created from DRAM via `modprobe brd`.
  ramdisk: /dev/ram0

  # Filesystem on the volumes.
  fstype: ext4

  # dm-era tracking granularity in bytes (optional; schelk defaults to 4096).
  # granularity: 4096

  # If /dev/ram0 is absent, schelk.sh loads brd with this size (KB). Rule of
  # thumb: ~4 GiB per ~1.7 TiB drive at 4 KiB granularity. 4 GiB = 4194304 KB.
  ramdisk_size_kb: 4194304

  # Skip the virgin->scratch copy at `init` time (you assert they are already
  # identical). Dangerous if untrue; leave false unless you know what you do.
  no_copy: false
